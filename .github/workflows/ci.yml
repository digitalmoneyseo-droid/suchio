name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - run: bun audit
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run types:workers --check
      - run: bun run validate:content
      - run: bun run test
      - run: bun run build
      - run: bunx wrangler deploy --config dist/server/wrangler.json --dry-run
      - run: bunx wrangler deploy --config wrangler.redirects.jsonc --dry-run
      - run: bun run validate:seo
      - run: bun run validate:performance
      - run: bun run validate:bundle
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            test-results/
            .wrangler/performance-budgets.json
          include-hidden-files: true
          retention-days: 7
